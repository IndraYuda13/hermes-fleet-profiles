terminal:
  backend: local
approvals:
  mode: 'off'
  denial_breaker_threshold: 2
  mcp_reload_confirm: false
  destructive_slash_confirm: false
  deny:
    - pkill *
    - killall *
    - killall5 *
    - '*$(pkill*'
    - '*$(killall*'
    - '*`pkill*'
    - '*`killall*'
    - '*kill*$(pgrep*'
    - '*$(pgrep*kill*'
    - '*kill*`pgrep*'
    - '*`pgrep*kill*'
    - '*kill*$(pidof*'
    - '*$(pidof*kill*'
    - '*kill*`pidof*'
    - '*`pidof*kill*'
    - '*pgrep*|*xargs*kill*'
    - '*pidof*|*xargs*kill*'
    - '*grep*|*xargs*kill*'
    - xargs pkill*
    - xargs -* pkill*
    - xargs killall*
    - xargs -* killall*
    - '*| xargs pkill*'
    - '*| xargs killall*'
    - '*pgrep*|*while*kill*'
    - '*pidof*|*while*kill*'
    - '*grep*|*while*kill*'
    - '*busybox*pkill*'
    - '*busybox*killall*'
    - '*eval *pkill*'
    - '*eval *killall*'
    - '*watch pkill*'
    - '*watch killall*'
    - '*su *pkill*'
    - '*su *killall*'
    - '*doas*pkill*'
    - '*doas*killall*'
    - '*kill*< <(pgrep*'
    - '*<(pgrep*kill*'
    - '*kill*< <(pidof*'
    - '*<(pidof*kill*'
