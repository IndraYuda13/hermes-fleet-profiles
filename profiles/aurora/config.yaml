curator:
  consolidate: true
  prune_builtins: false
approvals:
  mode: smart
  denial_breaker_threshold: 2
  mcp_reload_confirm: true
  destructive_slash_confirm: true
command_allowlist: []
kanban:
  dispatch_in_gateway: false
  dispatch_interval_seconds: 30
  orchestrator_profile: orion
  default_assignee: orion
  max_in_progress: 4
  max_in_progress_per_profile: 1
  auto_decompose: false
  auto_promote_children: true
gateway:
  platforms:
    a2a:
      enabled: true
      extra:
        port: 9903
    telegram:
      enabled: false
onboarding:
  seen:
    busy_input_prompt: true
    openclaw_residue_cleanup: true
    tool_progress_prompt: true
    profile_build_offered: true
_config_version: 44
custom_providers:
  - api_key: REDACTED
    base_url: https://9router.indrayuda.my.id/v1
    model: gpt
    models:
      ag-opus-pool:
        context_length: 950000
      gpt:
        context_length: 500000
    name: 9router.indrayuda.my.id
  - api_key: REDACTED
    base_url: http://localhost:20128/v1
    model: gpt
    models:
      ag-opus-pool:
        context_length: 950000
      gpt:
        context_length: 500000
    name: Local (localhost:20128)
mcp_servers:
  Canva:
    args:
      - -y
      - mcp-remote@latest
      - https://mcp.canva.com/mcp
    command: npx
plugins:
  disabled: []
  enabled:
    - platforms/a2a
    - ponytail
    - superpowers
    - web-firecrawl
    - web-searxng
