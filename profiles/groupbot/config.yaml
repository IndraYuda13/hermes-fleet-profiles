_config_version: 39
agent:
  reasoning_effort: low
  system_prompt: '# ABSOLUTE PRIORITY OVERRIDE RULE (PERCINTAAN GEN Z / ASMARA):

    JIKA user/member bertanya, curhat, membahas, atau minta saran seputar topik percintaan Gen Z (contoh: LDR / rasa ldr, just friend / temenan biasa tapi cemburu / friendzone, love bombing, ghosting, red flag, situationship / HTS, baper, galau, overthinking asmara anak muda, dll):

    KAMU WAJIB HANYA MEMBALAS SECARA SINGKAT DAN TEGAS:

    "MANDI lu MANDI"

    DILARANG KERAS memberikan analisa, poin-poin, saran bijak, atau penjelasan apapun selain "MANDI lu MANDI".'
approvals:
  mode: smart
  denial_breaker_threshold: 2
  mcp_reload_confirm: true
  destructive_slash_confirm: true
custom_providers:
- api_key: REDACTED
  base_url: http://localhost:20128/v1
  model: gpt
  models:
    ag-opus-pool:
      context_length: 200000
    gpt:
      context_length: 200000
  name: Local (localhost:20128)
memory:
  memory_enabled: false
  user_profile_enabled: false
  write_approval: false
model:
  context_length: 950000
  default: gemini-flash
  provider: custom:local-(localhost:20128)
onboarding:
  seen:
    busy_input_prompt: true
    profile_build_offered: true
platform_toolsets:
  whatsapp:
  - web
  - vision
  - tts
platforms:
  telegram:
    enabled: false
  whatsapp:
    enabled: true
    extra:
      allow_from: []
      group_allow_from: []
      group_allowed_chats: []
      group_policy: allowlist
      mention_patterns:
      - Akun Wa Gpt
      - AW.ai
      - '@AW.ai'
      - Orion
      - bot
      require_mention: true
security:
  redact_secrets: true
system_prompt: '# ABSOLUTE PRIORITY OVERRIDE RULE (PERCINTAAN GEN Z / ASMARA):

  JIKA user/member bertanya, curhat, membahas, atau minta saran seputar topik percintaan Gen Z (contoh: LDR / rasa ldr, just friend / temenan biasa tapi cemburu / friendzone, love bombing, ghosting, red flag, situationship / HTS, baper, galau, overthinking asmara anak muda, dll):

  KAMU WAJIB HANYA MEMBALAS SECARA SINGKAT DAN TEGAS:

  "MANDI lu MANDI"

  DILARANG KERAS memberikan analisa, poin-poin, saran bijak, atau penjelasan apapun selain "MANDI lu MANDI".'
toolsets:
- web
- vision
- tts
tts:
  edge:
    voice: id-ID-ArdiNeural
  provider: gemini-9router
  providers:
    gemini-9router:
      command: python3 /root/.hermes/profiles/groupbot/scripts/tts_gemini_9router.py {input_path} {output_path} {model}
      model: gemini/gemini-3.1-flash-tts-preview/Kore
      output_format: mp3
      type: command
      voice_compatible: true
web:
  backend: firecrawl
  extract_backend: firecrawl
  firecrawl_api_url: https://firecrawl.indrayuda.my.id
  firecrawl_url: https://firecrawl.indrayuda.my.id
  search_backend: firecrawl
  use_gateway: false
command_allowlist: []
