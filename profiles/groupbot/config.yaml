_config_version: 51
agent:
  reasoning_effort: low
  system_prompt: '# ABSOLUTE PRIORITY OVERRIDE RULE (PERCINTAAN GEN Z / ASMARA):

    JIKA user/member bertanya, curhat, membahas, atau minta saran seputar topik percintaan Gen Z (contoh: LDR / rasa ldr, just friend / temenan biasa tapi cemburu / friendzone, love bombing, ghosting, red flag, situationship / HTS, baper, galau, overthinking asmara anak muda, dll):

    KAMU WAJIB HANYA MEMBALAS SECARA SINGKAT DAN TEGAS:

    "MANDI lu MANDI"

    DILARANG KERAS memberikan analisa, poin-poin, saran bijak, atau penjelasan apapun selain "MANDI lu MANDI".'
  image_input_mode: native
approvals:
  mode: smart
  denial_breaker_threshold: 2
  mcp_reload_confirm: true
  destructive_slash_confirm: true
  deny:
  - pkill *
  - killall *
  - killall5 *
  - '*$(pkill*'
  - '*$(killall*'
  - '*`pkill*'
  - '*`killall*'
  - '*kill*$(pgrep*'
  - '*$(pgrep*kill*'
  - '*kill*`pgrep*'
  - '*`pgrep*kill*'
  - '*kill*$(pidof*'
  - '*$(pidof*kill*'
  - '*kill*`pidof*'
  - '*`pidof*kill*'
  - '*pgrep*|*xargs*kill*'
  - '*pidof*|*xargs*kill*'
  - '*grep*|*xargs*kill*'
  - xargs pkill*
  - xargs -* pkill*
  - xargs killall*
  - xargs -* killall*
  - '*| xargs pkill*'
  - '*| xargs killall*'
  - '*pgrep*|*while*kill*'
  - '*pidof*|*while*kill*'
  - '*grep*|*while*kill*'
  - '*busybox*pkill*'
  - '*busybox*killall*'
  - '*eval *pkill*'
  - '*eval *killall*'
  - '*watch pkill*'
  - '*watch killall*'
  - '*su *pkill*'
  - '*su *killall*'
  - '*doas*pkill*'
  - '*doas*killall*'
  - '*kill*< <(pgrep*'
  - '*<(pgrep*kill*'
  - '*kill*< <(pidof*'
  - '*<(pidof*kill*'
custom_providers:
- api_key: REDACTED
