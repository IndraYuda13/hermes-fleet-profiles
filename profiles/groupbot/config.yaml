  model: gpt
  models:
    ag-opus-pool:
      context_length: 524288
      supports_vision: true
    gpt:
      context_length: 200000
    ds:
      context_length: 524288
      supports_vision: true
    gpt-sol:
      context_length: 524288
      supports_vision: true
    gpt-terra:
      context_length: 524288
      supports_vision: true
  name: Local (localhost:20128)
memory:
