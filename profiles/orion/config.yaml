model:
  context_length: 950000
  default: ag-opus-pool
  provider: custom:local-(localhost:20128)
toolsets:
- kanban
- memory
- todo
- clarify
- session_search
- skills
agent:
  reasoning_effort: xhigh
web:
  backend: firecrawl
  search_backend: firecrawl
  extract_backend: firecrawl
  firecrawl_api_url: https://firecrawl.indrayuda.my.id
  firecrawl_url: https://firecrawl.indrayuda.my.id
  use_gateway: false
browser:
  cdp_url: http://127.0.0.1:9222
  use_real_profile: true
  real_profile_autoclose: true
context_file_max_chars: 150000
auxiliary:
  curator:
    provider: custom
    model: ag-opus-pool
    base_url: http://localhost:20128/v1
    timeout: 600
  background_review:
    provider: custom
    model: ag-opus-pool
    base_url: http://localhost:20128/v1
    timeout: 300
  video:
    model: ag/gemini-3.7-flash-high
display:
  platforms:
    telegram:
      busy_ack_detail: true
      show_reasoning: false
  tool_progress: all
dashboard:
  cors_origins: '[''https://hermes.indrayuda.my.id'']'
  host: 0.0.0.0
tts:
  edge:
    voice: id-ID-ArdiNeural
memory:
  write_approval: false
  nudge_interval: 4
  flush_min_turns: 3
delegation:
  orchestrator_enabled: false
  subagent_auto_approve: false
moa:
  enabled: false
skills:
  write_approval: false
  creation_nudge_interval: 4
  disabled:
  - ui-ux-pro-max
curator:
  consolidate: true
  prune_builtins: false
approvals:
  mode: smart
  denial_breaker_threshold: 2
  mcp_reload_confirm: true
  destructive_slash_confirm: true
command_allowlist: []
plugins:
  disabled: []
  enabled:
  - observability/langfuse
  - platforms/a2a
  - ponytail
  - superpowers
  - web-firecrawl
  - web-searxng
kanban:
  auto_subscribe_on_create: true
  dispatch_in_gateway: true
  review_dispatch: true
  dispatch_interval_seconds: 15
  orchestrator_profile: orion
  default_assignee: orion
  max_in_progress: 6
  max_in_progress_per_profile: 1
  auto_decompose: false
  auto_promote_children: true
network:
  force_ipv4: false
gateway:
  platforms:
    a2a:
      enabled: true
      extra:
        port: 9901
onboarding:
  seen:
    busy_input_prompt: true
    openclaw_residue_cleanup: true
_config_version: 44
a2a_agents:
  atlas:
    timeout: 900
    url: http://127.0.0.1:9902
  aurora:
    timeout: 1200
    url: http://127.0.0.1:9903
  forge:
    timeout: 1200
    url: http://127.0.0.1:9904
  frame:
    timeout: 1200
    url: http://127.0.0.1:9905
  lens:
    timeout: 1800
    url: http://127.0.0.1:9906
  nexus:
    timeout: 600
    url: http://127.0.0.1:9907
  prism:
    timeout: 1800
    url: http://127.0.0.1:9908
  quant:
    timeout: 900
    url: http://127.0.0.1:9909
  radar:
    timeout: 900
    url: http://127.0.0.1:9910
  sentinel:
    timeout: 1800
    url: http://127.0.0.1:9911
custom_providers:
- api_key: REDACTED
  base_url: https://9router.indrayuda.my.id/v1
  model: gpt
  models:
    ag-opus-pool:
      context_length: 950000
    gpt:
      context_length: 500000
  name: 9router.indrayuda.my.id
- api_key: REDACTED
