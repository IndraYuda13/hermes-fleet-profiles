  real_profile_autoclose: true
  use_real_profile: true
command_allowlist: []
context_file_max_chars: 150000
curator:
  consolidate: true
  prune_builtins: false
custom_providers:
- api_key: REDACTED
  base_url: https://9router.indrayuda.my.id/v1
  model: gpt
  models:
    ag-opus-pool:
      context_length: 950000
    gpt:
      context_length: 500000
  name: 9router.indrayuda.my.id
- api_key: REDACTED
  base_url: http://localhost:20128/v1
  model: gpt
