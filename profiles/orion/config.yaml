platforms:
  telegram:
    enabled: true
  whatsapp:
    enabled: true
    extra:
      allow_all_users: true
      allow_from: []
      group_allow_from: []
      group_allowed_chats: []
      group_policy: open
      require_mention: true
      bridge_port: 3001
      session_path: /root/.hermes/profiles/orion/whatsapp/session
      mention_patterns:
      - Orion
      - '@Orion'
      - \bOrion\b
      - bot
      - '@bot'
      - \bbot\b
      - Bb
      - '@Bb'
