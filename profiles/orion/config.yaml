_config_version: 39
a2a_agents:
  atlas:
    timeout: 300
    url: http://127.0.0.1:9902
  aurora:
    timeout: 300
    url: http://127.0.0.1:9903
  forge:
    timeout: 300
    url: http://127.0.0.1:9904
