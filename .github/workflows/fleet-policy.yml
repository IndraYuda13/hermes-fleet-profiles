name: Fleet Policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-policy.txt
      - run: python -m pip install -r requirements-policy.txt
      - run: python scripts/sanitize_config.py --check profiles/*/config.yaml
      - run: python scripts/sanitize_skill_examples.py --check global/skills profiles
      - run: python scripts/validate_fleet.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
