version: 1
name: ui-prototype-gauntlet
entry_profile: orion
timeout_seconds: 3600
execution_transport: kanban
minimum_task_count: 6
model_preflight_profiles: [orion, aurora, frame, prism, lens]
model_preflight_timeout_seconds: 90
child_task_policy:
  max_runtime_seconds: 3600
  max_retries: 2
  goal_max_turns: 40

quality_contract:
  creator_may_final_certify: false
  revise_until_pass_or_escalate: true
  max_remediation_cycles: 2
  original_verifier_retest_required: true
  fresh_revision_per_remediation: true
  exact_revision_parity_required: true
  ui_acceptance_floor:
    schema: CALIBRATION_V0
    calibration_status: UNCALIBRATED_HEURISTIC
    absolute_benchmark_claim_allowed: false
    minimum_weighted_total: 85
    minimum_dimension_score: 8
    all_applicable_hard_checks_true: true
    maximum_blocking_findings: 0
  functional_acceptance_floor:
    primary_journeys_verified: all
    required_states_verified: all
    maximum_unresolved_p0: 0
    maximum_unresolved_p1: 0
  proof_policy:
    criterion_to_evidence_mapping_required: true
    exact_revision_required: true
    artifact_digest_preferred: sha256
  escalation:
    exhausted_remediation_budget: BLOCKED
    mandatory_verifier_unavailable: BLOCKED
    missing_required_proof: BLOCKED
    threshold_override_allowed: false

brief:
  product: RelayOps
  objective: Build a production-shaped incident and service-operations dashboard prototype.
  users: [incident commander, service owner, support lead]
  primary_journeys:
    - assess current service health
    - open an incident and assign an owner
    - inspect the event timeline and affected services
    - close the incident with an auditable summary
  constraints:
    - static local prototype; no external API, account or secret
    - responsive at all required fleet viewports
    - keyboard operable with visible focus
    - loading, empty, error, active and resolved states
    - no unmotivated purple glow, generic card grids, or generic AI copy; design from incident operations truth
    - use realistic product-specific data; no lorem ipsum or placeholder leakage
    - LENS visual PASS requires CALIBRATION_V0 weighted score >= 85/100, every applicable dimension >= 8/10, all applicable hard checks true, and zero blocking findings
    - PRISM PASS requires every primary journey and required loading, empty, error, active and resolved state exercised with zero unresolved P0/P1 defects
    - any verifier failure must name defect IDs, severity, concrete evidence/reproduction, responsible owner and objective acceptance conditions before remediation
    - remediation must create a fresh commit and the original verifier must retest failed criteria plus invalidated regressions on that exact revision
    - if remediation budget is exhausted, mandatory proof is missing, or a mandatory verifier cannot run, closure is BLOCKED; ORION may not lower thresholds or substitute its own certification

required_artifacts:
  - PRODUCT_CONTEXT.md
  - CONTENT_MAP.md
  - REFERENCE_LEDGER.md
  - CANDIDATE_HYPOTHESES.md
  - SPIKE_MANIFEST.json
  - VISUAL_TOURNAMENT.json
  - DESIGN_DNA.md
  - DESIGN_CONTRACT.md
  - ASSET_MANIFEST.json
  - INTERACTION_CONTRACT.json
  - VERTICAL_SLICE_REPORT.md
  - BUILD_MANIFEST.json
  - FUNCTIONAL_QA.md
  - PRISM_VERIFICATION_REPORT.json
  - VISUAL_QA.md
  - LENS_REVIEW_REPORT.json
  - CLOSURE_REPORT.md
  - RELEASE_DECISION_RECORD.md
  - app/index.html
  - app/styles.css
  - app/app.js

required_manifests:
  - evidence/manifests/aurora-contract.json
  - evidence/manifests/frame-implementation.json
  - evidence/manifests/prism-functional.json
  - evidence/manifests/lens-rendered.json
  - evidence/manifests/orion-closure.json

revision_parity_manifests:
  - evidence/manifests/frame-implementation.json
  - evidence/manifests/prism-functional.json
  - evidence/manifests/lens-rendered.json
  - evidence/manifests/orion-closure.json

required_screenshots:
  - {path: evidence/screenshots/home-mobile-small.png, width: 320}
  - {path: evidence/screenshots/home-mobile.png, width: 390}
  - {path: evidence/screenshots/home-tablet.png, width: 768}
  - {path: evidence/screenshots/home-desktop.png, width: 1440}
  - {path: evidence/screenshots/home-desktop-wide.png, width: 1920}

expected_owners:
  evidence/manifests/aurora-contract.json: aurora
  evidence/manifests/frame-implementation.json: frame
  evidence/manifests/prism-functional.json: prism
  evidence/manifests/lens-rendered.json: lens
  evidence/manifests/orion-closure.json: orion

manifest_required_true_fields:
  evidence/manifests/frame-implementation.json: [source_anti_slop_zero_matches]
  evidence/manifests/prism-functional.json: [source_anti_slop_zero_matches]
  evidence/manifests/lens-rendered.json: [source_anti_slop_zero_matches]

manifest_required_criteria:
  evidence/manifests/prism-functional.json:
    - journey:assess-current-service-health
    - journey:open-incident-and-assign-owner
    - journey:inspect-event-timeline-and-affected-services
    - journey:close-incident-with-auditable-summary
    - state:loading
    - state:empty
    - state:error
    - state:active
    - state:resolved
  evidence/manifests/lens-rendered.json:
    - visual:identity
    - visual:composition
    - visual:typography
    - visual:assets
    - visual:interaction
    - visual:responsive
    - hard:generic-default-cluster

manifest_reconcilable_fields:
  - verifier
  - timestamp
  - gate_verdict
  - source_anti_slop_zero_matches

forbidden_source_patterns:
  - lorem ipsum
  - ai-powered
